spring:
  application:
    name: filemanager-backend
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
      allowed-headers: "*"

server:
  port: 8080
  servlet:
    context-path: ""

filemanager:
  base-dir: /tmp
  max-file-size: 104857600
  max-request-size: 104857600

logging:
  level:
    com.filemanager: info
    org.springframework: warn
  file:
    name: logs/filemanager.log
    max-size: 50MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      file-name-pattern: logs/filemanager_%d{yyyy-MM-dd}.%i.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

security:
  jwt:
    secret: your-secret-key
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

