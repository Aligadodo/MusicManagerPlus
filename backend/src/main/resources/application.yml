spring:
  application:
    name: filemanager-backend
  web:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080"
      allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
      allowed-headers: "*"
      allow-credentials: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${app.database.path:data/music_manager_plus.db}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: PRAGMA foreign_keys = ON

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.filemanager.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  database:
    path: data/music_manager_plus.db
    auto-init: true
    backup-path: data/backup
  storage:
    mode: database

server:
  port: 8080
  servlet:
    context-path: ""

filemanager:
  base-dir: /tmp
  max-file-size: 104857600
  max-request-size: 104857600
  log:
    directory: logs

logging:
  level:
    com.filemanager: debug
    com.filemanager.backend: debug
    org.springframework: debug
    org.springframework.web: debug
  file:
    name: logs/filemanager.log
    max-size: 50MB
    max-history: 30
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      file-name-pattern: logs/filemanager_%d{yyyy-MM-dd}.%i.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

security:
  jwt:
    secret: your-secret-key
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

