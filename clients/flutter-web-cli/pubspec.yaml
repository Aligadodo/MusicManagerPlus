name: filemanager_flutter
description: A new Flutter project for FileManager Plus
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  dio: ^5.4.3+1
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.2
  file_picker: ^8.0.6
  url_launcher: ^6.2.5
  intl: ^0.19.0
  json_annotation: ^4.9.0
  flutter_colorpicker: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/

